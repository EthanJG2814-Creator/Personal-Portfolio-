<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethan Guerrero</title>
  <meta name="description" content="Ethan Guerrero - Biomedical Engineer.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Stars layer: visible only when background is dark, rarely glimmer -->
  <div class="stars" id="stars" aria-hidden="true"></div>
  <!-- Shooting star layer: rare streak at night -->
  <div class="shooting-stars" id="shooting-stars" aria-hidden="true"></div>

  <!-- ============================================ -->
  <!-- BUSINESS CARD - Single page -->
  <!-- Replace photo src, name, title, phone, email, and link URLs below -->
  <!-- ============================================ -->

  <div class="card">
    <div class="card-inner">
      <!-- Left: circular profile photo - REPLACE src with your photo path -->
      <div class="card-photo-wrap">
        <img
          src="https://placehold.co/400x400/ffffff/e8e8e8?text=EG"
          alt="Ethan Guerrero"
          class="card-photo"
        >
      </div>

      <!-- Right: contact information - REPLACE placeholder text -->
      <div class="card-info">
        <h1 class="card-name">Ethan Guerrero</h1>
        <p class="card-title">Biomedical Engineer</p>
        <div class="card-contact">
          <p class="card-phone">P: 555-555-5555</p>
          <a href="mailto:ethan.guerrero@email.com" class="card-email">ethan.guerrero@email.com</a>
        </div>
        <div class="card-buttons">
          <a href="#" class="card-link-highlight">Personal Projects</a>
          <a href="#" class="card-link-highlight">Academic Projects</a>
          <a href="#" class="card-link-highlight">About</a>
        </div>
        <p class="card-links">
          <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer" class="card-link-highlight" aria-label="GitHub">GitHub</a>
          <span class="card-links-sep"> · </span>
          <a href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener noreferrer" class="card-link-highlight" aria-label="LinkedIn">LinkedIn</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
